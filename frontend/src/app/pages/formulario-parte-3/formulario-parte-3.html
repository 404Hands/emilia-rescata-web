<main>
    <div class="container">

        <div class="caja-titulo">
            <img src="/assets/HEADER_LOGO.png" alt="LOGO" class="logo">
            <h2>Formulario de Adopción</h2>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7">

                <form class="tarjeta-formulario">

                    <div class="pasos">
                        <div class="circulo activo"><i class="bi bi-check-lg"></i></div>
                        <div class="linea"></div>
                        <div class="circulo activo"><i class="bi bi-check-lg"></i></div>
                        <div class="linea"></div>
                        <div class="circulo">3</div>
                    </div>

                    <h4 class="subtitulo">Compromiso de Cuidado y Firma</h4>

                    <div class="campos">

                        <label for="motivo" class="form-label fw-bold">¿Por qué deseas adoptar a este perrito?</label>
                        <input type="text" id="motivo" class="form-control" required>

                        <p class="titulo-grupo">Tipo de vivienda:</p>
                        <div class="form-check">
                            <input type="radio" name="tiempo" id="tiempo1" class="form-check-input">
                            <label for="tiempo1" class="form-check-label">Sí, tengo tiempo todos los días</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="tiempo" id="tiempo2" class="form-check-input">
                            <label for="tiempo2" class="form-check-label">Solo fines de semana</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="tiempo" id="tiempo3" class="form-check-input">
                            <label for="tiempo3" class="form-check-label">No dispongo de mucho tiempo</label>
                        </div>

                        <p class="titulo-grupo">Declaración de compromiso:</p>
                        <div class="form-check caja-declaracion">
                            <input type="checkbox" id="declaracion" class="form-check-input" required>
                            <label for="declaracion" class="form-check-label">
                                Confirmo que cuento con la estabilidad económica y el compromiso para garantizar la
                                alimentación, salud y bienestar de la mascota, y acepto coordinar una entrevista previa.
                            </label>
                        </div>

                        <div class="d-grid gap-2 caja-botones">
                            <button type="button" class="btn boton-formulario" routerLink="/formulario-parte-2">ANTERIOR</button>
                            <button type="submit" class="btn boton-formulario" routerLink="/formulario-parte-4">GUARDAR</button>
                        </div>

                    </div>

                </form>

            </div>
        </div>

    </div>
</main>
