<main>
    <div class="container">

        <div class="caja-titulo">
            <img src="/assets/HEADER_LOGO.png" alt="LOGO" class="logo">
            <h2>Formulario de Adopción</h2>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7">

                <form class="tarjeta-formulario">

                    <div class="pasos">
                        <div class="circulo activo"><i class="bi bi-check-lg"></i></div>
                        <div class="linea"></div>
                        <div class="circulo">2</div>
                        <div class="linea"></div>
                        <div class="circulo">3</div>
                    </div>

                    <h4 class="subtitulo">Tu Hogar y Convivencia</h4>

                    <div class="campos">

                        <p class="titulo-grupo">Tipo de vivienda:</p>
                        <div class="form-check">
                            <input type="radio" name="vivienda" id="vivienda1" class="form-check-input">
                            <label for="vivienda1" class="form-check-label">Casa con patio</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="vivienda" id="vivienda2" class="form-check-input">
                            <label for="vivienda2" class="form-check-label">Casa sin patio</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="vivienda" id="vivienda3" class="form-check-input">
                            <label for="vivienda3" class="form-check-label">Departamento con patio</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="vivienda" id="vivienda4" class="form-check-input">
                            <label for="vivienda4" class="form-check-label">Departamento sin patio</label>
                        </div>

                        <p class="titulo-grupo">Tipo de vivienda:</p>
                        <div class="form-check">
                            <input type="radio" name="propiedad" id="propiedad1" class="form-check-input">
                            <label for="propiedad1" class="form-check-label">Propia</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="propiedad" id="propiedad2" class="form-check-input">
                            <label for="propiedad2" class="form-check-label">Alquilada (con permiso para mascotas)</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="propiedad" id="propiedad3" class="form-check-input">
                            <label for="propiedad3" class="form-check-label">Familiar</label>
                        </div>

                        <p class="titulo-grupo">¿Hay niños en casa?:</p>
                        <div class="form-check">
                            <input type="radio" name="ninos" id="ninos1" class="form-check-input">
                            <label for="ninos1" class="form-check-label">Sí</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="ninos" id="ninos2" class="form-check-input">
                            <label for="ninos2" class="form-check-label">No</label>
                        </div>

                        <p class="titulo-grupo">¿Tienes actualmente otras mascotas?:</p>
                        <div class="form-check">
                            <input type="radio" name="mascotas" id="mascotas1" class="form-check-input">
                            <label for="mascotas1" class="form-check-label">Sí</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="mascotas" id="mascotas2" class="form-check-input">
                            <label for="mascotas2" class="form-check-label">No</label>
                        </div>

                        <div class="d-grid gap-2 caja-botones">
                            <button type="button" class="btn boton-formulario" routerLink="/formulario-parte-1">ANTERIOR</button>
                            <button type="submit" class="btn boton-formulario" routerLink="/formulario-parte-3">SIGUIENTE</button>
                        </div>

                    </div>

                </form>

            </div>
        </div>

    </div>
</main>
